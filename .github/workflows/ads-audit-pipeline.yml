name: Ads Audit Pipeline

# Runs the full Smart Pursuit pipeline where it CAN run: a GitHub runner
# has Chrome + open internet (the Arena sandbox and restricted networks do
# not). One click: discover leads from the live Meta Ad Library -> audit
# their ads + conversion pages -> QA-verify every PDF -> generate outreach
# emails + the threaded-follow-up sequence manifest -> commit results back.
#
# NOTE: for the "Run workflow" button / `gh workflow run` to work, this
# file must be on the default branch (main) — standard GitHub rule.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover = leads from Meta Ad Library | audit = one known company"
        required: true
        default: "discover"
        type: choice
        options: [discover, audit]
      query:
        description: "Discover mode: market query, e.g. 'solar Hyderabad'"
        required: false
        default: "solar Hyderabad"
      limit:
        description: "Discover mode: how many leads to audit"
        required: false
        default: "5"
      website:
        description: "Audit mode: company website URL"
        required: false
        default: ""
      company:
        description: "Audit mode: company name"
        required: false
        default: ""
      city:
        description: "Audit mode: city"
        required: false
        default: ""
  # Weekly lead discovery: Mondays 09:30 IST (04:00 UTC), runs automatically
  # with the default query/limit below. The Arena agent token cannot
  # dispatch workflows (403), so the schedule + the owner's manual
  # "Run workflow" click in the Actions tab are the two ways to start it.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: ads-audit-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 01-LEADS/requirements.txt

      - name: Install dependencies + Chrome
        run: |
          pip install -r 01-LEADS/requirements.txt
          # The pipeline launches Playwright with channel="chrome",
          # so install Google Chrome (not just Chromium).
          playwright install --with-deps chrome

      - name: Discover leads + audit ads (Meta Ad Library)
        if: ${{ inputs.mode == 'discover' || github.event_name == 'schedule' }}
        working-directory: 01-LEADS
        run: |
          python discover_leads.py "${{ inputs.query || 'solar Hyderabad' }}" \
            --limit "${{ inputs.limit || '5' }}"

      - name: Audit one company (ads + conversion page)
        if: ${{ inputs.mode == 'audit' }}
        working-directory: 01-LEADS
        run: |
          python run_pipeline.py "${{ inputs.website }}" "${{ inputs.company }}" \
            --city "${{ inputs.city }}"

      - name: QA gate — verify every report
        working-directory: 01-LEADS
        run: python verify_report.py --all

      - name: Generate outreach emails + follow-up sequences
        working-directory: 02-OUTREACH
        run: python audit_outreach.py --export

      - name: Sequence status snapshot
        working-directory: 02-OUTREACH
        run: python sequence.py status || true

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ads-audit-results-${{ github.run_id }}
          path: |
            01-LEADS/audit_results/*.json
            01-LEADS/leads.csv
            02-OUTREACH/audit_pdfs/*.pdf
            02-OUTREACH/generated_emails/*
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit results back
        if: success()
        run: |
          git config user.name "smart-pursuit-bot"
          git config user.email "actions@github.com"
          git add 01-LEADS/audit_results 01-LEADS/leads.csv \
                  02-OUTREACH/audit_pdfs 02-OUTREACH/generated_emails || true
          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Pipeline run: ${{ inputs.mode }} '${{ inputs.query }}${{ inputs.company }}' (run ${{ github.run_id }})"
            git push
          fi
